# UEFA（openfootball）队名 -> football-data.co.uk 队名。
#
# 这是人工维护的数据文件，不是运行时猜出来的：猜错会把两家俱乐部
# 合并成一个，悄悄污染双方的实力评分，比直接丢掉这场比赛更糟。
#
# 新赛季出现没见过的队名时跑：
#     python -m src.aliases check      # 列出还没覆盖的队名
#     python -m src.aliases suggest    # 给出候选匹配供人工确认
# 没进表的队名会被当成一支独立球队（仍然起到连接联赛的作用，
# 但因为 min_team_matches 不会被推荐）。
#
# 当前覆盖 222 个队名。
# openligadb 用德语名（Inter Mailand、FC Brügge、AS Rom），是第三套命名。
# the-odds-api 又是一套写法（Inter Milan、AS Roma、Sporting Lisbon）。
