name: record-bet

# 在 Actions 页面填表记录一注真实投注（手机上也能操作）。
on:
  workflow_dispatch:
    inputs:
      pick_id:
        description: "报告里的 ID（直接复制）"
        required: true
        type: string
      odds:
        description: "你在 Tipico 实际拿到的赔率，例如 2.10"
        required: true
        type: string
      stake:
        description: "注额（欧元），例如 1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ledger-write
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 记录投注
        env:
          PICK_ID: ${{ inputs.pick_id }}
          ODDS: ${{ inputs.odds }}
          STAKE: ${{ inputs.stake }}
        run: |
          python -m src.ledger add "$PICK_ID" --odds "$ODDS" --stake "$STAKE" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 提交投注记录
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bets
          if git diff --staged --quiet; then
            echo "没有变化，不提交。"
            exit 0
          fi
          git commit -m "记录投注 ${{ inputs.pick_id }}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
