name: daily-report

on:
  schedule:
    - cron: "0 6 * * *"          # 每天 06:00 UTC
  workflow_dispatch:
    inputs:
      date:
        description: "目标日期 YYYY-MM-DD（留空 = 今天）"
        required: false
        type: string

permissions:
  contents: write

# 同一时间只跑一个，避免两次 push 打架
concurrency:
  group: ledger-write
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 按周缓存 football-data.co.uk 的下载，减少对数据源的请求
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      - name: 结算已结束的投注
        run: python -m src.ledger settle

      - name: 生成报告
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python -m src.daily --date "$TARGET_DATE"
          else
            python -m src.daily
          fi

      - name: 写进运行摘要（手机上可直接看）
        if: always()
        run: |
          cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '## 投注汇总' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m src.ledger summary >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 提交报告和模拟投注
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports bets
          if git diff --staged --quiet; then
            echo "没有变化，不提交。"
            exit 0
          fi
          git commit -m "每日报告 $(date -u +%F)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
