name: add-fixture

# 在 Actions 页面填表，给欧战/国家队补一场比赛的赔率（手机上也能操作）。
# 这些赛事没有免费的赔率源，价格只能手填——见 src/manual.py 的说明。
on:
  workflow_dispatch:
    inputs:
      comp:
        description: "赛事"
        required: true
        type: choice
        options: [CL, EL, UECL, INT]
      date:
        description: "开赛日期 YYYY-MM-DD"
        required: true
        type: string
      home:
        description: "主队（欧战用 football-data 写法如 Ath Madrid；国家队用英文国名如 Germany）"
        required: true
        type: string
      away:
        description: "客队"
        required: true
        type: string
      time:
        description: "开球时间 HH:MM（可留空）"
        required: false
        default: ""
        type: string
      neutral:
        description: "中立场？"
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]
      ref_h:
        description: "参考市场赔率 主胜（Pinnacle 优先，没有就用市场平均；不要填 Tipico）"
        required: false
        default: ""
        type: string
      ref_d:
        description: "参考市场赔率 平局"
        required: false
        default: ""
        type: string
      ref_a:
        description: "参考市场赔率 客胜"
        required: false
        default: ""
        type: string
      tip_h:
        description: "Tipico 赔率 主胜"
        required: false
        default: ""
        type: string
      tip_d:
        description: "Tipico 赔率 平局"
        required: false
        default: ""
        type: string
      tip_a:
        description: "Tipico 赔率 客胜"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: ledger-write
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 写入手填赛程
        env:
          COMP: ${{ inputs.comp }}
          DATE: ${{ inputs.date }}
          HOME: ${{ inputs.home }}
          AWAY: ${{ inputs.away }}
          TIME: ${{ inputs.time }}
          NEUTRAL: ${{ inputs.neutral }}
          REF_H: ${{ inputs.ref_h }}
          REF_D: ${{ inputs.ref_d }}
          REF_A: ${{ inputs.ref_a }}
          TIP_H: ${{ inputs.tip_h }}
          TIP_D: ${{ inputs.tip_d }}
          TIP_A: ${{ inputs.tip_a }}
        run: |
          python -m src.manual add --comp "$COMP" --date "$DATE" \
            --home "$HOME" --away "$AWAY" --time "$TIME" --neutral "$NEUTRAL" \
            --ref-h "$REF_H" --ref-d "$REF_D" --ref-a "$REF_A" \
            --tip-h "$TIP_H" --tip-d "$TIP_D" --tip-a "$TIP_A" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python -m src.manual list

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manual_fixtures.csv
          if git diff --staged --quiet; then
            echo "没有变化，不提交。"
            exit 0
          fi
          git commit -m "手填赛程 ${{ inputs.comp }} ${{ inputs.date }}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
