# 所有可调参数都放在这里，代码里不要写死数值。

# ---------------------------------------------------------------------------
# 国内联赛：football-data.co.uk 的 mmz4281 代码。
# 这些联赛有赛前赔率，也在 fixtures.csv 里，所以能直接出推荐。
# ---------------------------------------------------------------------------
